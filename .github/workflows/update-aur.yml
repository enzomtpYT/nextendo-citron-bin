name: Update AUR Package

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git openssh curl jq sed gawk pacman-contrib

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git safe directory & build permissions
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder || true
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Run update script
        run: |
          su builder -c "./update.sh"

      - name: Check if files changed
        id: git_status
        run: |
          if git diff --quiet PKGBUILD .SRCINFO; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No package updates detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Updates detected."
          fi

      - name: Publish to AUR (Strictly flat - PKGBUILD and .SRCINFO only)
        if: steps.git_status.outputs.changed == 'true'
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # 1. Setup SSH credentials for AUR
          mkdir -p -m 700 /root/.ssh
          echo "$AUR_KEY" > /root/.ssh/aur_ed25519
          chmod 600 /root/.ssh/aur_ed25519
          ssh-keyscan -v -t ed25519 aur.archlinux.org >> /root/.ssh/known_hosts

          export GIT_SSH_COMMAND="ssh -i /root/.ssh/aur_ed25519 -o StrictHostKeyChecking=accept-new"

          # 2. Clone the AUR repository into an isolated directory
          git clone ssh://aur@aur.archlinux.org/nextendo-citron-bin.git /tmp/aur-clean

          # 3. Copy ONLY the two required files into the AUR checkout
          cp PKGBUILD .SRCINFO /tmp/aur-clean/

          # 4. Commit and push strictly inside the AUR directory
          cd /tmp/aur-clean
          git config user.name "Enzo Joré (Bot)"
          git config user.email "bot@enzomtp.dev"

          git add PKGBUILD .SRCINFO
          NEW_VER=$(grep -E '^pkgver=' PKGBUILD | cut -d'=' -f2)
          git commit -m "Auto-update to ${NEW_VER}"
          git push origin master

      - name: Commit and push changes back to GitHub repository
        if: steps.git_status.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEW_VER=$(grep -E '^pkgver=' PKGBUILD | cut -d'=' -f2)
          git commit -am "chore(release): auto-update to ${NEW_VER}"
          git push origin master
